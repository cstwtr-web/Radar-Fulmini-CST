<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d47a1">
    <title>Radar e Fulmini DPC</title>
    
    <!-- Riga per l'installazione come App -->
    <link rel="manifest" href="manifest.json">

    <!-- Inclusione della libreria Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100vw; }
        /* Migliora la leggibilità del controllo dei layer */
        .leaflet-control-layers {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .leaflet-control-layers label {
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Inizializza la mappa (centrata sull'Italia)
        var map = L.map('map').setView([42.5, 12.5], 6);

        // 2. Aggiungi la mappa di base (OpenStreetMap)
        var baseMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Definisci l'URL del servizio WMS della Protezione Civile
        var wmsUrl = 'https://radar-geowebcache.protezionecivile.it/service/wms';

        // ==========================================
        // LAYER PRINCIPALI (attivi di default)
        // ==========================================

        // Radar VMI (Vertical Maximum Intensity) - Aggiornamento 5 min
        var radarLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:vmi',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'Dati Radar: <a href="https://radar.protezionecivile.it/">DPC</a>'
        }).addTo(map);

        // Fulmini LTG (Lightning) - Aggiornamento 10 min
        var fulminiLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:ltg',
            format: 'image/png',
            transparent: true,
            opacity: 1.0,
            attribution: 'Dati Fulmini: <a href="https://radar.protezionecivile.it/">DPC</a>'
        }).addTo(map);

        // ==========================================
        // ALTRI LAYER (attivabili dal menu)
        // ==========================================

        // Intensità di Pioggia al suolo (SRI) - Aggiornamento 5 min
        var sriLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:sri',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'Dati Pioggia: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Cumulata di Pioggia 1 ora (SRT_1) - Aggiornamento 5 min
        var srt1Layer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:srt1',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'Dati Cumulate: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Cumulata di Pioggia 3 ore (SRT_3) - Aggiornamento 60 min
        var srt3Layer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:srt3',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'Dati Cumulate: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Temperatura al suolo (TMP) - Aggiornamento 60 min
        var tempLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:tmp',
            format: 'image/png',
            transparent: true,
            opacity: 0.6,
            attribution: 'Dati Temperature: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Copertura Nuvolosa (IR108) - Aggiornamento 5 min
        var nuvoleLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:ir108',
            format: 'image/png',
            transparent: true,
            opacity: 0.6,
            attribution: 'Dati Satellitari: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Heavy Rain Detection (HRD) - Allerta piogge intense - Aggiornamento 5 min
        var hrdLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:hrd',
            format: 'image/png',
            transparent: true,
            opacity: 0.8,
            attribution: 'Dati HRD: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // Stato dei Radar (SITES) - Aggiornamento 5 min
        var sitesLayer = L.tileLayer.wms(wmsUrl, {
            layers: 'radar:sites',
            format: 'image/png',
            transparent: true,
            opacity: 1.0,
            attribution: 'Stato Radar: <a href="https://radar.protezionecivile.it/">DPC</a>'
        });

        // ==========================================
        // CONTROLLO DEI LAYER (Menu)
        // ==========================================
        var overlays = {
            "Radar (VMI)": radarLayer,
            "Fulmini (LTG)": fulminiLayer,
            "Intensità Pioggia (SRI)": sriLayer,
            "Cumulata 1h (SRT_1)": srt1Layer,
            "Cumulata 3h (SRT_3)": srt3Layer,
            "Temperature (TMP)": tempLayer,
            "Copertura Nuvolosa (IR108)": nuvoleLayer,
            "Allerta Piogge Intense (HRD)": hrdLayer,
            "Stato Radar (SITES)": sitesLayer
        };
        
        L.control.layers(null, overlays, { collapsed: false }).addTo(map);

        // ==========================================
        // AGGIORNAMENTO AUTOMATICO
        // ==========================================
        // Forza il ricaricamento delle immagini ogni 5 minuti per evitare la cache
        setInterval(function() {
            radarLayer.setParams({ _t: Date.now() });
            fulminiLayer.setParams({ _t: Date.now() });
            sriLayer.setParams({ _t: Date.now() });
            srt1Layer.setParams({ _t: Date.now() });
            tempLayer.setParams({ _t: Date.now() });
            nuvoleLayer.setParams({ _t: Date.now() });
            hrdLayer.setParams({ _t: Date.now() });
        }, 300000); // 5 minuti

    </script>
</body>
</html>
